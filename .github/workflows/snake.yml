name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: aashbirsingh25
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=79C0FF&color_dots=0d1117,132030,1f3550,3f6690,79C0FF
            dist/github-contribution-grid-snake-dark.svg?color_snake=79C0FF&color_dots=0d1117,132030,1f3550,3f6690,79C0FF
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
