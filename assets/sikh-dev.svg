<svg width="460" height="360" viewBox="0 0 460 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6D28D9"/>
      <stop offset="45%" stop-color="#C2410C"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="turbanSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="shaft" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="scene"><rect width="460" height="360" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#scene)">
    <!-- room -->
    <rect width="460" height="360" fill="#141922"/>
    <rect y="298" width="460" height="62" fill="#10141C"/>
    <!-- baseboard -->
    <rect y="294" width="460" height="5" fill="#1C222E"/>

    <!-- window (right wall) -->
    <rect x="296" y="38" width="138" height="178" rx="8" fill="#2A3140"/>
    <rect x="304" y="46" width="122" height="162" rx="4" fill="url(#sky)"/>
    <!-- low evening sun -->
    <circle cx="352" cy="150" r="20" fill="#FDE68A"/>
    <circle cx="352" cy="150" r="27" fill="#FDE68A" opacity="0.25">
      <animate attributeName="r" values="27;31;27" dur="5s" repeatCount="indefinite"/>
    </circle>
    <!-- clouds -->
    <rect x="314" y="86" width="44" height="7" rx="3.5" fill="#F3E8FF" opacity="0.5"/>
    <rect x="352" y="106" width="58" height="7" rx="3.5" fill="#FDE68A" opacity="0.4"/>
    <!-- birds -->
    <path d="M390 74 q4 -5 8 0 M398 74 q4 -5 8 0" stroke="#3B2A4A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M376 92 q3 -4 6 0" stroke="#3B2A4A" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- city silhouette -->
    <path d="M304 176 L304 208 L426 208 L426 168 L406 168 L406 182 L388 182 L388 158 L368 158 L368 186 L344 186 L344 170 L326 170 L326 184 L304 184 Z" fill="#3B2050" opacity="0.85"/>
    <!-- mullions -->
    <line x1="365" y1="46" x2="365" y2="208" stroke="#2A3140" stroke-width="6"/>
    <line x1="304" y1="128" x2="426" y2="128" stroke="#2A3140" stroke-width="6"/>
    <!-- sill -->
    <rect x="288" y="214" width="154" height="9" rx="4" fill="#232B3A"/>
    <!-- curtain -->
    <path d="M290 34 C300 90 288 150 296 222 L276 222 C270 150 276 90 272 34 Z" fill="#7C3AED" opacity="0.85">
      <animateTransform attributeName="transform" type="skewX" values="0;1.2;0" dur="6s" repeatCount="indefinite"/>
    </path>

    <!-- light shaft from window -->
    <path d="M300 60 L432 60 L330 310 L140 310 Z" fill="url(#shaft)"/>
    <!-- floor light pool -->
    <path d="M150 306 L330 306 L300 330 L110 330 Z" fill="#FBBF24" opacity="0.07"/>

    <!-- dust motes -->
    <g fill="#FDE68A">
      <circle cx="330" cy="140" r="1.6" opacity="0.6"><animateTransform attributeName="transform" type="translate" values="0 0; -26 40; -52 80" dur="9s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.6;0.25;0" dur="9s" repeatCount="indefinite"/></circle>
      <circle cx="368" cy="110" r="1.3" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0; -30 46; -60 92" dur="11s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.2;0" dur="11s" repeatCount="indefinite"/></circle>
      <circle cx="300" cy="170" r="1.4" opacity="0.5"><animateTransform attributeName="transform" type="translate" values="0 0; -22 36; -44 72" dur="8s" begin="2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.5;0.2;0" dur="8s" begin="2s" repeatCount="indefinite"/></circle>
    </g>

    <!-- shelf, plant, books (left wall) -->
    <rect x="52" y="86" width="112" height="7" rx="3.5" fill="#232B3A"/>
    <!-- plant -->
    <path d="M74 86 L74 72 M74 78 C66 74 64 66 66 60 C74 64 76 70 74 78 M74 74 C80 68 88 68 92 62 C90 74 82 78 74 78" stroke="#34D399" stroke-width="2.6" fill="none" stroke-linecap="round"/>
    <rect x="66" y="78" width="16" height="10" rx="3" fill="#D96F4E"/>
    <!-- books -->
    <rect x="106" y="64" width="8" height="22" rx="1.5" fill="#38BDF8"/>
    <rect x="116" y="60" width="8" height="26" rx="1.5" fill="#A78BFA"/>
    <rect x="126" y="66" width="8" height="20" rx="1.5" fill="#D96F4E"/>
    <rect x="136" y="62" width="9" height="24" rx="1.5" fill="#34D399" transform="rotate(8 140 74)"/>

    <!-- poster -->
    <rect x="196" y="52" width="52" height="64" rx="6" fill="#1B212D" stroke="#2A3140"/>
    <text x="222" y="90" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="15" font-weight="700" fill="#38BDF8">&lt;/&gt;</text>

    <!-- rug -->
    <ellipse cx="185" cy="330" rx="120" ry="16" fill="#1A2130"/>

    <!-- ================= desk ================= -->
    <rect x="28" y="212" width="150" height="10" rx="5" fill="#2A3346"/>
    <rect x="38" y="222" width="8" height="86" rx="3" fill="#1F2634"/>
    <rect x="158" y="222" width="8" height="86" rx="3" fill="#1F2634"/>

    <!-- laptop, side view, screen facing right toward him -->
    <rect x="66" y="204" width="64" height="8" rx="3" fill="#2A3140"/>
    <path d="M70 206 L64 160 L72 158 L84 204 Z" fill="#3A4356"/>
    <path d="M66 161 L70 204 L74 203 L71 162 Z" fill="#38BDF8" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.65;0.9" dur="2.2s" repeatCount="indefinite"/>
    </path>
    <!-- screen glow toward face -->
    <path d="M74 162 L74 204 L150 190 L150 150 Z" fill="#38BDF8" opacity="0.08"/>

    <!-- chai -->
    <rect x="140" y="192" width="15" height="19" rx="3.5" fill="#D96F4E"/>
    <path d="M155 196 C162 196 162 206 155 206" stroke="#D96F4E" stroke-width="2.6" fill="none"/>
    <path d="M145 188 C143 183 147 181 145 176" stroke="#8B949E" stroke-width="2" stroke-linecap="round" fill="none" opacity="0.6">
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="0 0; 0 -6; 0 0" dur="3s" repeatCount="indefinite"/>
    </path>

    <!-- ================= character, left profile ================= -->

    <!-- chair -->
    <rect x="238" y="170" width="14" height="110" rx="7" fill="#1E2530"/>
    <rect x="180" y="252" width="72" height="12" rx="6" fill="#1E2530"/>
    <rect x="208" y="264" width="10" height="42" rx="4" fill="#171D26"/>
    <path d="M188 306 L238 306" stroke="#171D26" stroke-width="8" stroke-linecap="round"/>

    <!-- legs -->
    <path d="M196 252 C176 252 160 258 150 270 L150 296 L164 296 L166 276 C176 268 190 264 200 264 Z" fill="#2E3A4F"/>
    <rect x="142" y="292" width="30" height="12" rx="6" fill="#1B212D"/>

    <!-- torso leaning slightly forward -->
    <path d="M186 168 C168 176 158 196 158 218 C158 240 172 256 196 256 L226 256 C236 246 240 214 232 188 C226 170 208 158 186 168 Z" fill="#232B3A"/>
    <!-- warm rim light on his back (window side) -->
    <path d="M228 182 C236 206 236 236 227 252" stroke="#FBBF24" stroke-width="3.4" stroke-linecap="round" opacity="0.5"/>

    <!-- arm to keyboard -->
    <path d="M188 200 C170 206 150 208 128 208 L128 218 C152 220 176 218 192 212 Z" fill="#2E3A4F"/>
    <!-- typing hand -->
    <circle cx="124" cy="210" r="6.4" fill="#E8B98A">
      <animate attributeName="cy" values="210;207;210" dur="0.5s" repeatCount="indefinite"/>
    </circle>

    <!-- neck -->
    <rect x="176" y="146" width="18" height="24" rx="8" fill="#E8B98A"/>

    <!-- head, left profile -->
    <path d="M150 116 C150 96 164 82 184 82 C202 82 212 96 212 114 C212 134 200 146 184 148 C166 150 150 136 150 116 Z" fill="#E8B98A"/>
    <!-- nose -->
    <path d="M151 110 C141 111 139 121 150 124 C153 123 153 114 151 110 Z" fill="#E8B98A"/>
    <path d="M149 123 C145 122 143 117 146 112" stroke="#D9A268" stroke-width="1.6" fill="none" stroke-linecap="round"/>
    <!-- eye -->
    <ellipse cx="160" cy="109" rx="3.8" ry="4.5">
      <animate attributeName="ry" values="4;4;0.5;4;4" keyTimes="0;0.45;0.5;0.55;1" dur="4.2s" repeatCount="indefinite"/>
    </ellipse>
    <!-- eyebrow -->
    <path d="M154 99 Q161 96 168 99" stroke="#2B2118" stroke-width="2.8" stroke-linecap="round" fill="none"/>
    <!-- ear -->
    <circle cx="192" cy="118" r="6" fill="#DBA875"/>

    <!-- adult beard: neat band along the jawline -->
    <path d="M151 127 C154 149 166 161 182 160 C198 159 208 147 210 131 C205 140 195 145 185 145 C171 146 159 138 151 127 Z" fill="#2B2118"/>
    <!-- mustache under the nose: thin, neat -->
    <path d="M151 126 C155 124 160 125 163 128" stroke="#2B2118" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- adult dastar, side profile: peaked front, sweeping pleats -->
    <path d="M148 108 C142 84 156 62 182 58 C208 54 224 72 222 96 C221 108 216 116 210 120 C214 100 208 84 194 78 C176 70 156 84 148 108 Z" fill="url(#turbanSide)"/>
    <path d="M148 108 C154 88 170 74 190 76 C208 78 216 92 214 110 C213 116 211 119 210 120 C212 102 204 88 190 84 C172 78 154 90 148 108 Z" fill="#6D28D9"/>
    <!-- pleat lines sweeping back -->
    <path d="M158 84 C170 74 190 70 204 78" stroke="#5B21B6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <path d="M152 96 C166 82 192 78 210 88" stroke="#5B21B6" stroke-width="2.6" stroke-linecap="round" fill="none"/>
    <!-- front peak fold -->
    <path d="M148 108 L166 54 L182 60 C168 70 154 88 148 108 Z" fill="#8B5CF6"/>
    <path d="M166 54 L182 60 L176 64 L164 59 Z" fill="#A78BFA"/>
    <!-- larh band across forehead -->
    <path d="M148 108 C160 92 186 82 212 94 L210 102 C188 90 164 96 150 112 Z" fill="#5B21B6"/>
  </g>
</svg>
