<svg width="880" height="260" viewBox="0 0 880 260" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#A78BFA" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <clipPath id="win"><rect width="880" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <!-- window chrome -->
    <rect width="880" height="260" fill="#0D1117"/>
    <rect width="880" height="42" fill="#1A2029"/>
    <!-- traffic lights -->
    <circle cx="26" cy="21" r="6.5" fill="#FF5F56"/>
    <circle cx="48" cy="21" r="6.5" fill="#FFBD2E"/>
    <circle cx="70" cy="21" r="6.5" fill="#27C93F"/>
    <!-- window title -->
    <text x="440" y="26" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#8E8E8E">aashbir@github: ~</text>

    <!-- session -->
    <g font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace">
      <!-- $ whoami -->
      <text x="36" y="84" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#8B949E" dx="10">whoami</tspan></text>
      <text x="34" y="138" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="46" font-weight="800" letter-spacing="-1" fill="url(#nameGrad)">Aashbir Singh</text>

      <!-- $ role -->
      <text x="36" y="180" font-size="15"><tspan fill="#27C93F">$</tspan><tspan fill="#8B949E" dx="10">cat role.txt</tspan></text>
      <text x="36" y="208" font-size="16" letter-spacing="4" fill="#E6EDF3">FULL-STACK DEVELOPER</text>

      <!-- status on the right -->
      <g>
        <rect x="618" y="70" width="226" height="30" rx="15" fill="#10B98114" stroke="#10B98155"/>
        <circle cx="640" cy="85" r="4" fill="#34D399">
          <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <circle cx="640" cy="85" r="4" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6">
          <animate attributeName="r" values="4;9" dur="1.8s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
        </circle>
        <text x="656" y="90" font-size="12" letter-spacing="1.2" fill="#34D399">OPEN TO OPPORTUNITIES</text>
      </g>

      <!-- decorative faded history, right side -->
      <text x="620" y="140" font-size="12.5" fill="#2C3442">$ git commit -m "ship it"</text>
      <text x="620" y="164" font-size="12.5" fill="#2C3442">$ python agents.py --run</text>
      <text x="620" y="188" font-size="12.5" fill="#242C39">$ npm run build ✓</text>

      <!-- prompt with blinking cursor -->
      <text x="36" y="242" font-size="15" fill="#27C93F">$</text>
      <rect x="54" y="229" width="9.5" height="16" fill="#38BDF8">
        <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- hairline frame -->
    <rect x="0.5" y="0.5" width="879" height="259" rx="13.5" stroke="#2A3140"/>
  </g>
</svg>
