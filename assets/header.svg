<svg width="880" height="250" viewBox="0 0 880 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#A78BFA" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C83FD"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="nameGlow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#1C2230" stroke-width="1"/>
    </pattern>
    <clipPath id="frame"><rect width="880" height="250" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="250" fill="#0A0C10"/>
    <rect width="880" height="250" fill="url(#grid)" opacity="0.5"/>
    <!-- vignette so grid fades toward center -->
    <ellipse cx="440" cy="125" rx="360" ry="150" fill="#0A0C10" opacity="0.72" filter="url(#soft)"/>

    <!-- drifting aurora glows -->
    <ellipse cx="180" cy="250" rx="220" ry="90" fill="#7C3AED" opacity="0.18" filter="url(#soft)">
      <animate attributeName="cx" values="180;280;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="0" rx="240" ry="90" fill="#0EA5E9" opacity="0.15" filter="url(#soft)">
      <animate attributeName="cx" values="700;600;700" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- star dust -->
    <g fill="#E6EDF3">
      <circle cx="96" cy="58" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="212" cy="150" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.08;0.35" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="42" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="196" r="1.3" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="668" cy="62" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="782" cy="132" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="452" cy="30" r="1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="200" r="1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.06;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- terminal breadcrumb -->
    <text x="40" y="46" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#3D4450">~/aashbir <tspan fill="#38BDF8">$</tspan></text>

    <!-- flanking glyphs -->
    <text x="118" y="118" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#7C83FD" opacity="0.35">&lt;<animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.5s" repeatCount="indefinite"/></text>
    <text x="722" y="118" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="34" font-weight="700" fill="#7C83FD" opacity="0.35">/&gt;<animate attributeName="opacity" values="0.35;0.75;0.35" dur="3.5s" repeatCount="indefinite"/></text>

    <!-- name glow + name -->
    <text x="440" y="120" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="#7C83FD" opacity="0.55" filter="url(#nameGlow)">Aashbir Singh</text>
    <text x="440" y="120" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#nameGrad)">Aashbir Singh</text>

    <!-- role -->
    <text x="440" y="158" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="7" fill="#8B949E">FULL-STACK DEVELOPER</text>
    <rect x="611" y="146" width="9" height="15" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- open to opportunities pill -->
    <g>
      <rect x="324" y="180" width="232" height="30" rx="15" fill="#10B98114" stroke="#10B98155"/>
      <circle cx="346" cy="195" r="4" fill="#34D399">
        <animate attributeName="opacity" values="1;0.25;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <circle cx="346" cy="195" r="4" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.6">
        <animate attributeName="r" values="4;9" dur="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;0" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="362" y="200" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="12" letter-spacing="1.5" fill="#34D399">OPEN TO OPPORTUNITIES</text>
    </g>

    <!-- location -->
    <text x="440" y="234" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="11.5" letter-spacing="2" fill="#3D4450">&#128205; INDIA &#183; GURUGRAM &#183; BANGALORE &#183; REMOTE</text>

    <!-- corner ticks -->
    <path d="M28 28 L28 16 L40 16" stroke="#2A3140" stroke-width="2" fill="none"/>
    <path d="M852 28 L852 16 L840 16" stroke="#2A3140" stroke-width="2" fill="none"/>
    <path d="M28 222 L28 234 L40 234" stroke="#2A3140" stroke-width="2" fill="none"/>
    <path d="M852 222 L852 234 L840 234" stroke="#2A3140" stroke-width="2" fill="none"/>

    <!-- hairline frame -->
    <rect x="0.5" y="0.5" width="879" height="249" rx="15.5" stroke="#1F2430"/>
  </g>
</svg>
