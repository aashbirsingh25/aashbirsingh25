<svg width="880" height="230" viewBox="0 0 880 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#A78BFA;#38BDF8" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#A78BFA">
        <animate attributeName="stop-color" values="#A78BFA;#38BDF8;#A78BFA" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#7C83FD"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="frame"><rect width="880" height="230" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="880" height="230" fill="#0A0C10"/>

    <!-- drifting aurora glows -->
    <ellipse cx="180" cy="230" rx="220" ry="90" fill="#7C3AED" opacity="0.16" filter="url(#soft)">
      <animate attributeName="cx" values="180;280;180" dur="14s" repeatCount="indefinite"/>
    </ellipse>
    <ellipse cx="700" cy="0" rx="240" ry="90" fill="#0EA5E9" opacity="0.13" filter="url(#soft)">
      <animate attributeName="cx" values="700;600;700" dur="16s" repeatCount="indefinite"/>
    </ellipse>

    <!-- star dust -->
    <g fill="#E6EDF3">
      <circle cx="96" cy="58" r="1.3" opacity="0.5"><animate attributeName="opacity" values="0.5;0.1;0.5" dur="3.2s" repeatCount="indefinite"/></circle>
      <circle cx="212" cy="150" r="1" opacity="0.35"><animate attributeName="opacity" values="0.35;0.08;0.35" dur="4.1s" repeatCount="indefinite"/></circle>
      <circle cx="318" cy="42" r="1.1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.1;0.4" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="560" cy="180" r="1.3" opacity="0.45"><animate attributeName="opacity" values="0.45;0.1;0.45" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="668" cy="62" r="1" opacity="0.4"><animate attributeName="opacity" values="0.4;0.08;0.4" dur="2.9s" repeatCount="indefinite"/></circle>
      <circle cx="782" cy="132" r="1.2" opacity="0.5"><animate attributeName="opacity" values="0.5;0.12;0.5" dur="4.4s" repeatCount="indefinite"/></circle>
      <circle cx="452" cy="30" r="1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.08;0.3" dur="3.9s" repeatCount="indefinite"/></circle>
      <circle cx="130" cy="196" r="1" opacity="0.3"><animate attributeName="opacity" values="0.3;0.06;0.3" dur="3.1s" repeatCount="indefinite"/></circle>
    </g>

    <!-- terminal breadcrumb -->
    <text x="40" y="46" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="13" fill="#3D4450">~/aashbir <tspan fill="#38BDF8">$</tspan></text>

    <!-- name -->
    <text x="440" y="122" text-anchor="middle" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="58" font-weight="800" letter-spacing="-1" fill="url(#nameGrad)">Aashbir Singh</text>

    <!-- role -->
    <text x="440" y="162" text-anchor="middle" font-family="ui-monospace,'SF Mono',Menlo,Consolas,monospace" font-size="14" letter-spacing="7" fill="#8B949E">FULL-STACK DEVELOPER<tspan fill="#38BDF8">_</tspan></text>
    <rect x="617" y="150" width="9" height="15" fill="#38BDF8">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- drawing accent line -->
    <line x1="290" y1="190" x2="590" y2="190" stroke="url(#lineGrad)" stroke-width="2" stroke-dasharray="300" stroke-dashoffset="300">
      <animate attributeName="stroke-dashoffset" values="300;0" dur="1.6s" fill="freeze"/>
    </line>

    <!-- hairline frame -->
    <rect x="0.5" y="0.5" width="879" height="229" rx="15.5" stroke="#1F2430"/>
  </g>
</svg>
