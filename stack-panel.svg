<svg width="490" height="300" viewBox="0 0 490 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Consolas, Menlo, monospace">
  <defs>
    <style>
      .bg { fill: #0a0e14; }
      .chrome { fill: #11161f; }
      .title { fill: #565b66; font-size: 12px; letter-spacing: 0.5px; }
      .grp { fill: #ffb454; font-size: 13px; letter-spacing: 0.5px; }
      .item { fill: #e6e1cf; font-size: 13.5px; }
      .track { fill: #1c212b; }
      .bar { fill: #39bae6; }
      .barAlt { fill: #7fd962; }
    </style>
  </defs>

  <rect class="bg" width="490" height="300" rx="10"/>
  <rect class="chrome" width="490" height="34" rx="10"/>
  <rect class="chrome" x="0" y="20" width="490" height="14"/>
  <circle cx="22" cy="17" r="5" fill="#f26d78"/>
  <circle cx="40" cy="17" r="5" fill="#ffb454"/>
  <circle cx="58" cy="17" r="5" fill="#7fd962"/>
  <text x="245" y="22" class="title" text-anchor="middle">stack.yaml</text>

  <g transform="translate(28,64)" font-size="13.5">
    <text x="0" y="0" class="grp">languages</text>
    <text x="0" y="20" class="item">Python · TypeScript · JavaScript</text>

    <text x="0" y="52" class="grp">backend</text>
    <g transform="translate(0,64)">
      <text x="0" y="0" class="item">FastAPI</text>
      <rect class="track" x="140" y="-11" width="290" height="8" rx="4"/>
      <rect class="bar" x="140" y="-11" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="255" begin="0.3s" dur="0.6s" fill="freeze"/></rect>
    </g>
    <g transform="translate(0,88)">
      <text x="0" y="0" class="item">REST · WebSockets · SSE</text>
      <rect class="track" x="200" y="-11" width="230" height="8" rx="4"/>
      <rect class="bar" x="200" y="-11" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="195" begin="0.45s" dur="0.6s" fill="freeze"/></rect>
    </g>

    <text x="0" y="128" class="grp">frontend</text>
    <g transform="translate(0,140)">
      <text x="0" y="0" class="item">React · MUI</text>
      <rect class="track" x="140" y="-11" width="290" height="8" rx="4"/>
      <rect class="barAlt" x="140" y="-11" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="220" begin="0.6s" dur="0.6s" fill="freeze"/></rect>
    </g>

    <text x="0" y="180" class="grp">ai / data</text>
    <g transform="translate(0,192)">
      <text x="0" y="0" class="item">FAISS · Gemini · OpenAI</text>
      <rect class="track" x="200" y="-11" width="230" height="8" rx="4"/>
      <rect class="barAlt" x="200" y="-11" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="205" begin="0.75s" dur="0.6s" fill="freeze"/></rect>
    </g>

    <text x="0" y="222" class="grp">infra</text>
    <g transform="translate(0,234)">
      <text x="0" y="0" class="item">Render · Vercel · GH Actions</text>
      <rect class="track" x="210" y="-11" width="220" height="8" rx="4"/>
      <rect class="bar" x="210" y="-11" width="0" height="8" rx="4"><animate attributeName="width" from="0" to="150" begin="0.9s" dur="0.6s" fill="freeze"/></rect>
    </g>
  </g>
</svg>
